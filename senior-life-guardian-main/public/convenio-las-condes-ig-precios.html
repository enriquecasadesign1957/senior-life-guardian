<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="utf-8" />
  <title>Instagram — Precios Tarjeta Vecino</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0b1220; }
    .post {
      width: 1080px;
      height: 1350px;
      background: linear-gradient(180deg, #0d4f5c 0%, #0f6b7c 100%);
      color: #fff;
      font-family: "Segoe UI", system-ui, sans-serif;
      padding: 72px 64px 64px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .brand { display: flex; align-items: center; gap: 16px; }
    .brand img { height: 76px; background: #fff; border-radius: 18px; padding: 7px; }
    .kicker { font-size: 24px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #ffd66b; }
    h1 { margin-top: 28px; font-size: 64px; line-height: 1; font-weight: 900; letter-spacing: -0.03em; }
    .mid { margin: auto 0; }
    .cards { margin-top: 36px; display: flex; flex-direction: column; gap: 22px; }
    .foot { font-size: 28px; font-weight: 800; }
    .card { background: #fff; color: #0f172a; border-radius: 32px; padding: 28px 32px 26px; }
    .card.senior { outline: 8px solid #ffd66b; }
    .who { font-size: 28px; font-weight: 800; color: #0d4f5c; }
    .off { display: inline-block; margin-top: 10px; background: #16a34a; color: #fff; border-radius: 999px; padding: 6px 12px; font-size: 18px; font-weight: 800; }
    .price { margin-top: 8px; font-size: 78px; font-weight: 900; letter-spacing: -0.045em; line-height: 1; }
    .price small { font-size: 30px; }
    .year { margin-top: 8px; font-size: 26px; }
    .was { margin-top: 4px; font-size: 22px; color: #64748b; text-decoration: line-through; }
    .foot { margin-top: 28px; font-size: 28px; font-weight: 800; }
  </style>
</head>
<body>
  <article class="post">
    <div class="brand">
      <img src="brochure/logo-senior-safe.png" alt="Senior Safe" />
      <div class="kicker">Tarjeta Vecino · Las Condes</div>
    </div>
    <div class="mid">
      <h1>Dos descuentos en el Plan Único</h1>
      <div class="cards">
      <div class="card senior">
        <div class="who">Tarjeta Vecino Adulto Mayor</div>
        <div class="off">20% de descuento</div>
        <div class="price">$5.520<small>/mes</small></div>
        <div class="year">o $55.200 al año</div>
        <div class="was">Antes $6.900 / $69.000</div>
      </div>
      <div class="card">
        <div class="who">Tarjeta Vecino</div>
        <div class="off">15% de descuento</div>
        <div class="price">$5.865<small>/mes</small></div>
        <div class="year">o $58.650 al año</div>
        <div class="was">Antes $6.900 / $69.000</div>
      </div>
      </div>
    </div>
    <div class="foot">alarmaseniorsafe.cl/las-condes</div>
  </article>
</body>
</html>
