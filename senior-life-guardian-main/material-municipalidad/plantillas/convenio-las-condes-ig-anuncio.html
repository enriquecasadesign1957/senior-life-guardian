<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="utf-8" />
  <title>Instagram — Ahora en Tarjeta Vecino</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0b1220; }
    .post {
      width: 1080px;
      height: 1350px;
      background: linear-gradient(165deg, #0d4f5c 0%, #0f6b7c 55%, #125e6c 100%);
      color: #fff;
      font-family: "Segoe UI", system-ui, sans-serif;
      padding: 72px 72px 64px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .post::before {
      content: "";
      position: absolute;
      width: 640px;
      height: 640px;
      border-radius: 50%;
      background: rgba(255, 214, 107, 0.14);
      right: -180px;
      top: -160px;
    }
    .post::after {
      content: "";
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: rgba(22, 163, 74, 0.12);
      left: -180px;
      bottom: -160px;
    }
    .brand, .main, .foot { position: relative; z-index: 1; }
    .brand { display: flex; align-items: center; gap: 16px; }
    .brand img { height: 88px; background: #fff; border-radius: 20px; padding: 8px; }
    .brand strong { display: block; font-size: 28px; letter-spacing: -0.02em; }
    .brand span { display: block; margin-top: 2px; font-size: 20px; color: rgba(255,255,255,0.82); }
    .main { margin: auto 0; }
    .kicker { font-size: 28px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #ffd66b; }
    h1 { margin-top: 18px; font-size: 92px; line-height: 0.95; font-weight: 900; letter-spacing: -0.04em; max-width: 900px; }
    .lead { margin-top: 28px; font-size: 34px; line-height: 1.3; max-width: 860px; }
    .price { margin-top: 36px; display: inline-flex; align-items: baseline; gap: 10px; background: #fff; color: #0f172a; border-radius: 24px; padding: 16px 24px; }
    .price b { font-size: 52px; letter-spacing: -0.04em; }
    .price small { font-size: 22px; font-weight: 700; color: #334155; }
    .also { margin-top: 16px; font-size: 26px; font-weight: 700; color: rgba(255,255,255,0.92); }
    .foot { font-size: 28px; font-weight: 800; }
  </style>
</head>
<body>
  <article class="post">
    <div class="brand">
      <img src="brochure/logo-senior-safe.png" alt="Senior Safe" />
      <div>
        <strong>Senior Safe</strong>
        <span>Plan Único</span>
      </div>
    </div>
    <div class="main">
      <div class="kicker">Las Condes</div>
      <h1>Ahora estamos en Tarjeta Vecino</h1>
      <p class="lead">Alarma en el celular del adulto mayor, con botón de emergencia.</p>
      <div class="price"><b>$5.520</b><small>/mes Adulto Mayor</small></div>
      <p class="also">o $5.865 al mes con Tarjeta Vecino</p>
    </div>
    <div class="foot">alarmaseniorsafe.cl/las-condes</div>
  </article>
</body>
</html>
