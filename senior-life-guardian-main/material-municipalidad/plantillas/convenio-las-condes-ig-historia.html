<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="utf-8" />
  <title>Historia de Instagram — Tarjeta Vecino</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0b1220; }
    .story {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(180deg, #0d4f5c 0%, #0f6b7c 70%, #125e6c 100%);
      color: #fff;
      font-family: "Segoe UI", system-ui, sans-serif;
      padding: 280px 80px 320px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .story::before {
      content: "";
      position: absolute;
      width: 720px;
      height: 720px;
      border-radius: 50%;
      background: rgba(255, 214, 107, 0.16);
      right: -220px;
      top: 180px;
    }
    .brand, .main, .foot { position: relative; z-index: 1; }
    .brand img { height: 110px; background: #fff; border-radius: 24px; padding: 10px; }
    .main { margin: auto 0; }
    .kicker { font-size: 32px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: #ffd66b; }
    h1 { margin-top: 22px; font-size: 108px; line-height: 0.92; font-weight: 900; letter-spacing: -0.045em; }
    .lead { margin-top: 32px; font-size: 40px; line-height: 1.25; }
    .price { margin-top: 40px; background: #fff; color: #0f172a; display: inline-flex; align-items: baseline; gap: 12px; border-radius: 28px; padding: 18px 26px; }
    .price b { font-size: 64px; letter-spacing: -0.04em; }
    .price small { font-size: 26px; font-weight: 700; }
    .also { margin-top: 18px; font-size: 32px; font-weight: 700; }
    .foot { font-size: 34px; font-weight: 800; }
  </style>
</head>
<body>
  <article class="story">
    <div class="brand">
      <img src="brochure/logo-senior-safe.png" alt="Senior Safe" />
    </div>
    <div class="main">
      <div class="kicker">Las Condes</div>
      <h1>Ahora en Tarjeta Vecino</h1>
      <p class="lead">Botón de emergencia en el celular. Aviso a hasta 3 familiares.</p>
      <div class="price"><b>$5.520</b><small>/mes · Adulto Mayor</small></div>
      <p class="also">Tarjeta Vecino · $5.865/mes</p>
    </div>
    <div class="foot">alarmaseniorsafe.cl/las-condes</div>
  </article>
</body>
</html>
