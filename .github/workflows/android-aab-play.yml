name: Build Android AAB (Google Play)

# AAB firmado para Prueba interna / Producción en Play Console.
# Requiere secrets de keystore (ver BUILD_ANDROID.md).

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName (ej. 1.0.0)"
        required: true
        default: "1.0.0"
      version_code:
        description: "versionCode entero (sube +1 en cada subida a Play)"
        required: true
        default: "1"
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  APP_DIR: senior-life-guardian-main

jobs:
  build-aab:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolver versión
        id: ver
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.version_name }}" >> "$GITHUB_OUTPUT"
            echo "code=${{ github.event.inputs.version_code }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            TAG="${TAG#v}"
            if [[ "$TAG" == *+* ]]; then
              NAME="${TAG%%+*}"
              CODE="${TAG#*+}"
            else
              NAME="$TAG"
              CODE="${GITHUB_RUN_NUMBER}"
            fi
            echo "name=${NAME}" >> "$GITHUB_OUTPUT"
            echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0 platform-tools

      - name: Install dependencies
        run: bun install

      - name: Generate app icons
        run: node scripts/generate-app-icons.mjs

      - name: Install Capacitor Android
        run: |
          bun add @capacitor/core @capacitor/cli @capacitor/android \
                  @capacitor/splash-screen @capacitor/local-notifications \
                  @capacitor/geolocation @capacitor/device

      - name: Build web bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: bun run build

      - name: Sync Android project
        run: |
          if [ ! -d "android" ]; then
            bunx cap add android
          fi
          bunx @capacitor/assets generate --assetPath resources --iconBackgroundColor '#dc2626' --iconBackgroundColorDark '#dc2626' --splashBackgroundColor '#dc2626' --splashBackgroundColorDark '#dc2626'
          bunx cap sync android
          test -f android/app/src/main/assets/capacitor.plugins.json

      - name: Permisos GPS en AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="true" />' "$MANIFEST"
          fi

      - name: Configurar firma release
        env:
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.ver.outputs.name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-android-release.mjs

      - name: Build AAB (bundleRelease)
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Empaquetar AAB
        run: |
          mkdir -p artifacts
          SRC="android/app/build/outputs/bundle/release/app-release.aab"
          OUT="artifacts/SeniorSafe-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}.aab"
          cp "$SRC" "$OUT"
          cp "$SRC" artifacts/SeniorSafe-release.aab
          ls -la artifacts/

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeniorSafe-AAB-v${{ steps.ver.outputs.name }}
          path: ${{ env.APP_DIR }}/artifacts/*.aab
          retention-days: 90

      - name: GitHub Release (solo tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_DIR }}/artifacts/SeniorSafe-release.aab
          make_latest: true
