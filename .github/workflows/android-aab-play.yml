name: Build Android AAB (Google Play)

# AAB firmado para Prueba interna / Producción en Play Console.
# Requiere secrets de keystore (ver BUILD_ANDROID.md).

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName (ej. 1.0.0)"
        required: true
        default: "1.0.0"
      version_code:
        description: "versionCode entero (sube +1 en cada subida a Play)"
        required: true
        default: "1"
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  APP_DIR: senior-life-guardian-main
  JAVA_VERSION: "21"
  ANDROID_PLATFORM: "platforms;android-35"
  ANDROID_BUILD_TOOLS: "build-tools;35.0.0"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.jvmargs=-Xmx2g"

jobs:
  build-aab:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      # Obligatorio: clonar el repo antes de Java, Android SDK o Gradle.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar código descargado
        run: |
          set -euo pipefail
          echo "Workspace: $(pwd)"
          ls -la
          test -d "${{ env.APP_DIR }}"
          test -f "${{ env.APP_DIR }}/package.json"
          echo "✓ Repositorio listo en ${{ env.APP_DIR }}"

      - name: Resolver versión
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.version_name }}" >> "$GITHUB_OUTPUT"
            echo "code=${{ github.event.inputs.version_code }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            TAG="${TAG#v}"
            if [[ "$TAG" == *+* ]]; then
              NAME="${TAG%%+*}"
              CODE="${TAG#*+}"
            else
              NAME="$TAG"
              CODE="${GITHUB_RUN_NUMBER}"
            fi
            echo "name=${NAME}" >> "$GITHUB_OUTPUT"
            echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: bun install

      - name: Generate app icons
        working-directory: ${{ env.APP_DIR }}
        run: node scripts/generate-app-icons.mjs

      - name: Install Capacitor Android
        working-directory: ${{ env.APP_DIR }}
        run: |
          bun add @capacitor/core @capacitor/cli @capacitor/android \
                  @capacitor/splash-screen @capacitor/local-notifications \
                  @capacitor/geolocation @capacitor/device

      - name: Build web bundle
        working-directory: ${{ env.APP_DIR }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: bun run build

      - name: Sync Android project
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ ! -d "android" ]; then
            bunx cap add android
          fi
          bunx @capacitor/assets generate --assetPath resources --iconBackgroundColor '#dc2626' --iconBackgroundColorDark '#dc2626' --splashBackgroundColor '#dc2626' --splashBackgroundColorDark '#dc2626'
          bunx cap sync android
          test -f android/app/src/main/assets/capacitor.plugins.json

      # Gradle 8.14.x (Capacitor 8) — Java 17+; Temurin 21 LTS (después de generar android/).
      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: ${{ env.APP_DIR }}/android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ${{ env.ANDROID_PLATFORM }} ${{ env.ANDROID_BUILD_TOOLS }} platform-tools

      # setup-android ya acepta licencias; no usar "yes | sdkmanager" con pipefail (exit 1 por SIGPIPE).
      - name: Verificar componentes Android SDK
        run: |
          set -eu
          sdkmanager --list_installed | grep -E "platforms;android-|build-tools;|platform-tools" || true

      - name: Verificar Java
        run: |
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"

      - name: Permisos GPS en AndroidManifest
        working-directory: ${{ env.APP_DIR }}
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="true" />' "$MANIFEST"
          fi

      - name: Configurar firma release
        id: signing
        working-directory: ${{ env.APP_DIR }}
        env:
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.ver.outputs.name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-android-release.mjs

      - name: Verificar keystore (alias PKCS12)
        working-directory: ${{ env.APP_DIR }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -list -storetype PKCS12 -keystore android/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" | head -n 8

      - name: Build AAB (bundleRelease)
        working-directory: ${{ env.APP_DIR }}/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ steps.signing.outputs.key_alias || secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Empaquetar AAB
        working-directory: ${{ env.APP_DIR }}
        run: |
          mkdir -p artifacts
          SRC="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$SRC"
          OUT="artifacts/SeniorSafe-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}.aab"
          cp "$SRC" "$OUT"
          cp "$SRC" artifacts/SeniorSafe-release.aab
          ls -la artifacts/

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeniorSafe-AAB-v${{ steps.ver.outputs.name }}
          path: ${{ env.APP_DIR }}/artifacts/*.aab
          retention-days: 90

      - name: GitHub Release (solo tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_DIR }}/artifacts/SeniorSafe-release.aab
          make_latest: true
