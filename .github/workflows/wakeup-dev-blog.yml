name: WakeUp Dev blog generator

# Weekly (Monday 14:00 UTC) + manual. Opens a PR — does not deploy.
#
# Repo settings required (Settings > Actions > General > Workflow permissions):
#   - Read and write permissions
#   - Allow GitHub Actions to create and approve pull requests
# Secret required (exact name): GROQ_API_KEY

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic angle (leave empty for Groq to pick)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: wakeup-dev/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate post
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "Missing repository secret GROQ_API_KEY"
            echo "Add it under Settings > Secrets and variables > Actions"
            exit 1
          fi
          TOPIC="${{ github.event.inputs.topic }}"
          if [ -n "$TOPIC" ]; then
            node scripts/generate-blog-post.mjs --topic "$TOPIC"
          else
            node scripts/generate-blog-post.mjs
          fi

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: wakeup-dev-blog-bot
          GIT_AUTHOR_EMAIL: administrador@wakeupdev.com
          GIT_COMMITTER_NAME: wakeup-dev-blog-bot
          GIT_COMMITTER_EMAIL: administrador@wakeupdev.com
        working-directory: .
        run: |
          git config user.name "wakeup-dev-blog-bot"
          git config user.email "administrador@wakeupdev.com"
          git add -- wakeup-dev/web/content/blog wakeup-dev/web/lib/blog/generated.ts
          if git diff --cached --quiet; then
            echo "No generated files to commit"
            exit 0
          fi
          BRANCH="blog/auto-$(date -u +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          git commit -m "Add generated WakeUp Dev blog post"
          git push -u origin HEAD
          gh pr create --title "Blog: generated engineering post" --body "Groq drafted a new WakeUp Dev post as JSON. Review copy and code samples, then deploy wakeup-dev/web after merge so sitemap.xml picks up the new /blog/<slug> from generated.ts."
