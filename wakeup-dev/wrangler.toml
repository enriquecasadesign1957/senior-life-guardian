name = "wakeup-dev"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# Dominio público de la API (zona wakeupdev.com)
[[routes]]
pattern = "api.wakeupdev.com"
custom_domain = true

# Variables no secretas
[vars]
GROQ_MODEL = "llama-3.1-8b-instant"
BILLING_CREDITS_PRO = "50"
WEB_ORIGIN = "https://wakeupdev.com"
SUPABASE_URL = "https://tnauozhexefyjeicytmc.supabase.co"
TWILIO_ACCOUNT_SID = "ACedd1056141c820adce622fe5e25ea3be"
TRANSBANK_ENVIRONMENT = "sandbox"
TRANSBANK_PLAN_CLP = "25000"
ENABLE_AMD = "false"
ADMIN_NOTIFY_EMAIL = "enriquecasadesign@gmail.com"
# Remitente WakeUp Dev (verificar wakeupdev.com en Resend → Domains)
RESEND_FROM = "WakeUp Dev <administrador@wakeupdev.com>"

[triggers]
crons = ["0 14 * * *"]

